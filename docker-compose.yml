services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wings_of_power_backend
    container_name: wings_of_power_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/wings_of_power
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-secret}
      - JWT_EXPIRY=${JWT_EXPIRY:-86400}
      - SESSION_SECRET=${SESSION_SECRET:-secret}
      - APP_KEY=${APP_KEY:-secret}
      - APP_NAME=Wings of Power
      - APP_URL=http://localhost:4000
      - CLIENT_APP_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
    command: node dist/src/main

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wings_of_power
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
